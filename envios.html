<!DOCTYPE html>
<!--
    ARCHIVO: envios.html | CAPA: FRONTEND (solo recepción y administración)
    SIRVE PARA: ver los avisos enviados a pacientes y usuarios, y si la cuenta tiene correo.
    CONECTA CON: backend/envios.php, js/app.js, css/clinica.css
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vida Salud · Envíos de avisos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/clinica.css">
</head>
<body>
<div class="app">
    <div id="menu"></div>
    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Envíos de avisos</h1>
                <p>Lo que el sistema avisó a cada persona. Sirve para revisar que los avisos salieron.</p>
            </div>
        </div>

        <section class="tarjeta">
            <div class="tabla-wrap">
                <table class="table align-middle">
                    <thead><tr><th>Fecha</th><th>Para</th><th>Correo</th><th>Mensaje</th></tr></thead>
                    <tbody id="cuerpo"><tr><td colspan="4" class="cargando">Cargando…</td></tr></tbody>
                </table>
            </div>
            <div class="small text-muted mt-2">Se muestran los últimos 200 avisos. Si la persona no tiene correo, el aviso solo aparece dentro de la página.</div>
        </section>
    </main>
</div>

<script src="js/app.js"></script>
<script>
(function () {
    document.addEventListener('DOMContentLoaded', async () => {
        const usuario = await Clinica.requerirSesion();
        if (!['Administrador', 'Recepcionista'].includes(usuario.rol)) { location.replace('inicio.html'); return; }
        Clinica.dibujarMenu('envios');
        try {
            const d = await Clinica.api('envios.php');
            document.getElementById('cuerpo').innerHTML = d.avisos.length
                ? d.avisos.map(a => `<tr>
                    <td data-label="Fecha">${Clinica.fecha(a.creada)}</td>
                    <td data-label="Para">${Clinica.esc(a.destinatario)}<div class="small text-muted">${Clinica.esc(a.contacto)}</div></td>
                    <td data-label="Correo">${a.tiene_correo === 'Sí' ? '<span class="estado-badge estado-confirmada">Sí</span>' : '<span class="text-muted">No</span>'}</td>
                    <td data-label="Mensaje">${Clinica.esc(a.mensaje)}</td></tr>`).join('')
                : '<tr><td colspan="4" class="text-muted">Todavía no se ha enviado ningún aviso.</td></tr>';
        } catch (e) {
            document.getElementById('cuerpo').innerHTML = `<tr><td colspan="4" class="text-danger">${Clinica.esc(e.message)}</td></tr>`;
        }
    });
})();
</script>
</body>
</html>
