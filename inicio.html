<!DOCTYPE html>
<!--
    ARCHIVO: inicio.html | CAPA: FRONTEND (panel de inicio)
    SIRVE PARA: ver de un vistazo los números de la clínica y las próximas citas.
    QUÉ HACE: pide backend/resumen.php y dibuja tarjetas, la línea de próximas citas y el resumen del día.
    CONECTA CON: backend/resumen.php, js/app.js, css/clinica.css
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vida Salud · Inicio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/clinica.css">
</head>
<body>
<div class="app">
    <div id="menu"></div>
    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1 id="saludo">Bienvenido</h1>
                <p id="fechaHoy"></p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a href="citas.html?nueva=1" class="btn btn-primary" style="background:#0b7285;border-color:#0b7285;">
                    <i class="fa-solid fa-plus"></i> Programar cita</a>
                <a href="pacientes.html?nuevo=1" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-user-plus"></i> Nuevo paciente</a>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-6 col-xl-3">
                <div class="tarjeta metrica">
                    <div class="circulo bg-teal"><i class="fa-solid fa-user-injured"></i></div>
                    <div><div class="numero" id="kPacientes">–</div><div class="etiqueta">Pacientes activos</div></div>
                </div>
            </div>
            <div class="col-6 col-xl-3">
                <div class="tarjeta metrica">
                    <div class="circulo bg-azul"><i class="fa-solid fa-user-doctor"></i></div>
                    <div><div class="numero" id="kMedicos">–</div><div class="etiqueta">Médicos activos</div></div>
                </div>
            </div>
            <div class="col-6 col-xl-3">
                <div class="tarjeta metrica">
                    <div class="circulo bg-verde"><i class="fa-solid fa-calendar-day"></i></div>
                    <div><div class="numero" id="kHoy">–</div><div class="etiqueta">Citas de hoy</div></div>
                </div>
            </div>
            <div class="col-6 col-xl-3">
                <div class="tarjeta metrica">
                    <div class="circulo bg-naranja"><i class="fa-solid fa-hourglass-half"></i></div>
                    <div><div class="numero" id="kPendientes">–</div><div class="etiqueta">Por atender hoy</div></div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-lg-7">
                <section class="tarjeta h-100">
                    <h2><i class="fa-solid fa-clock text-info"></i> Próximas citas</h2>
                    <div id="proximas" class="cargando">Cargando…</div>
                </section>
            </div>
            <div class="col-lg-5">
                <section class="tarjeta h-100">
                    <h2><i class="fa-solid fa-chart-simple text-success"></i> Resumen de hoy</h2>
                    <div id="resumenHoy" class="cargando">Cargando…</div>
                    <hr>
                    <h2 class="mt-2"><i class="fa-solid fa-bolt text-warning"></i> Accesos rápidos</h2>
                    <div class="d-grid gap-2">
                        <a class="btn btn-outline-primary" href="citas.html"><i class="fa-solid fa-calendar-check"></i> Ver agenda completa</a>
                        <a class="btn btn-outline-primary" href="medicos.html"><i class="fa-solid fa-user-doctor"></i> Ver médicos y horarios</a>
                        <a class="btn btn-outline-primary" href="pacientes.html"><i class="fa-solid fa-address-book"></i> Buscar paciente</a>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const usuario = await Clinica.requerirSesion();
    Clinica.dibujarMenu('inicio');

    const hora = new Date().getHours();
    const saludo = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';
    document.getElementById('saludo').textContent = `${saludo}, ${usuario.nombre.split(' ')[0]}`;
    document.getElementById('fechaHoy').textContent = new Date().toLocaleDateString('es-BO',
        { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    try {
        const r = await Clinica.api('resumen.php');
        document.getElementById('kPacientes').textContent = r.pacientes_activos;
        document.getElementById('kMedicos').textContent = r.medicos_activos;
        document.getElementById('kHoy').textContent = r.citas_hoy;
        const e = r.citas_hoy_estado || {};
        const pendientes = (e.Programada || 0) + (e.Confirmada || 0);
        document.getElementById('kPendientes').textContent = pendientes;

        // Barras del día por estado
        const total = r.citas_hoy || 0;
        const estados = ['Programada', 'Confirmada', 'Atendida', 'Inasistencia', 'Cancelada'];
        document.getElementById('resumenHoy').innerHTML = total === 0
            ? '<div class="vacio"><i class="fa-solid fa-mug-hot"></i>No hay citas programadas para hoy.</div>'
            : estados.map(s => {
                const n = e[s] || 0;
                const pct = Math.round((n / total) * 100);
                return `<div class="etiqueta-barra"><span>${s}</span><strong>${n}</strong></div>
                        <div class="barra"><div style="width:${pct}%"></div></div>`;
            }).join('');

        // Línea de tiempo de próximas citas
        const proximas = r.proximas || [];
        document.getElementById('proximas').innerHTML = proximas.length === 0
            ? '<div class="vacio"><i class="fa-solid fa-calendar-xmark"></i>No hay citas próximas.</div>'
            : '<ul class="linea-tiempo">' + proximas.map(c => {
                const f = new Date(c.inicio.replace(' ', 'T'));
                const dia = f.toLocaleDateString('es-BO', { day: '2-digit', month: 'short' });
                const hh = f.toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit' });
                return `<li>
                    <div class="bloque-hora">${Clinica.esc(hh)}<small>${Clinica.esc(dia)}</small></div>
                    <div class="flex-grow-1">
                        <div class="fw-bold">${Clinica.esc(c.paciente)}</div>
                        <div class="text-muted small">${Clinica.esc(c.especialidad)} · ${Clinica.esc(c.medico)}</div>
                    </div>
                    <div>${Clinica.estadoBadge(c.estado)}</div>
                </li>`;
            }).join('') + '</ul>';
    } catch (e) {
        document.getElementById('proximas').textContent = e.message;
    }
});
</script>
</body>
</html>
