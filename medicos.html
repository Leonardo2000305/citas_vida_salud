<!DOCTYPE html>
<!--
    ARCHIVO: medicos.html | CAPA: FRONTEND (pantalla de médicos)
    SIRVE PARA: ver los médicos, sus especialidades y sus horarios de atención (RF03, RF05).
    QUÉ HACE: lee backend/especialidades_medicos.php?tipo=medicos y dibuja una tarjeta por médico.
    CONECTA CON: backend/especialidades_medicos.php, citas.html (programar), js/app.js, css/clinica.css
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vida Salud · Médicos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/clinica.css">
</head>
<body>
<div class="app">
    <div id="menu"></div>
    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Médicos y horarios</h1>
                <p>Especialidades y horas de atención de cada profesional.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <select class="form-select" id="filtroEsp" style="min-width:220px"><option value="">Todas las especialidades</option></select>
            </div>
        </div>
        <div class="row g-3" id="lista"><div class="cargando col-12">Cargando…</div></div>
    </main>
</div>

<!-- Programar cita para pacientes, sin salir de esta página -->
<div class="modal fade" id="modalCita" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="formCita" novalidate>
            <div class="modal-header">
                <h5 class="modal-title">Programar cita</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div id="errorCita" class="alert alert-danger d-none"></div>
                <div class="mb-3"><div class="small text-muted">Médico</div><div class="fw-bold" id="cMedico"></div></div>
                <div class="mb-3"><label class="form-label" for="cEspecialidad">Especialidad *</label>
                    <select class="form-select" id="cEspecialidad" required></select></div>
                <div class="row g-3">
                    <div class="col-6"><label class="form-label" for="cFecha">Fecha *</label>
                        <input type="date" class="form-control" id="cFecha" required></div>
                    <div class="col-6"><label class="form-label" for="cHora">Hora libre *</label>
                        <select class="form-select" id="cHora" required><option value="">Elija una fecha</option></select></div>
                </div>
                <div class="mt-3"><label class="form-label" for="cMotivo">Motivo de la consulta</label>
                    <input class="form-control" id="cMotivo" maxlength="200" placeholder="Ej.: control anual, dolor de cabeza…"></div>
                <p class="small text-muted mt-3 mb-0">Solo aparecen horas libres dentro del horario del médico.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="btnCita">Programar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
const DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

document.addEventListener('DOMContentLoaded', async () => {
    await Clinica.requerirSesion();
    Clinica.dibujarMenu('medicos');
    const lista = document.getElementById('lista');
    const filtro = document.getElementById('filtroEsp');

    try {
        const [med, esp] = await Promise.all([
            Clinica.api('especialidades_medicos.php?tipo=medicos'),
            Clinica.api('especialidades_medicos.php?tipo=especialidades'),
        ]);
        esp.especialidades.forEach(e => filtro.insertAdjacentHTML('beforeend',
            `<option value="${e.id_especialidad}">${Clinica.esc(e.nombre)}</option>`));

        function dibujar() {
            const idEsp = filtro.value;
            const medicos = med.medicos.filter(m => !idEsp || m.especialidades.some(x => String(x.id_especialidad) === idEsp));
            if (medicos.length === 0) {
                lista.innerHTML = '<div class="col-12"><div class="tarjeta vacio"><i class="fa-solid fa-user-doctor"></i>No hay médicos para esta especialidad.</div></div>';
                return;
            }
            lista.innerHTML = medicos.map(m => {
                const iniciales = (m.nombres[0] || '') + (m.apellidos[0] || '');
                const horarios = m.horarios.length
                    ? m.horarios.map(h => `<li><i class="fa-regular fa-clock"></i> ${DIAS[h.dia_semana]}: ${h.hora_inicio} – ${h.hora_fin}
                        <span class="text-muted">(citas de ${h.duracion_cita} min)</span></li>`).join('')
                    : '<li>Sin horario asignado</li>';
                return `
                <div class="col-md-6 col-xl-4">
                    <article class="tarjeta medico-card h-100">
                        <div class="d-flex gap-3 align-items-center">
                            <div class="avatar">${Clinica.esc(iniciales.toUpperCase())}</div>
                            <div>
                                <div class="fw-bold fs-5">Dr. ${Clinica.esc(m.nombres)} ${Clinica.esc(m.apellidos)}</div>
                                <div class="small text-muted">${Clinica.esc(m.codigo)} · Reg. ${Clinica.esc(m.registro_profesional)}</div>
                                <span class="estado ${m.activo ? 'estado-activo' : 'estado-inactivo'}">${m.activo ? 'Atiende' : 'No atiende'}</span>
                            </div>
                        </div>
                        <div>${m.especialidades.map(x => `<span class="chip">${Clinica.esc(x.nombre)}</span>`).join('')}</div>
                        <div><strong class="small">Horarios de atención</strong>
                            <ul class="lista-horarios mt-1">${horarios}</ul></div>
                        <div class="small text-muted"><i class="fa-solid fa-phone"></i> ${Clinica.esc(m.telefono || '—')}
                            &nbsp; <i class="fa-solid fa-envelope"></i> ${Clinica.esc(m.correo || '—')}</div>
                        ${Clinica.usuario.rol === 'Médico' && Number(m.id_medico) === Number(Clinica.usuario.id_medico) ? '' : Clinica.usuario.rol === 'Paciente'
                            ? `<button type="button" class="btn btn-outline-primary mt-auto" data-programar="${m.id_medico}">
                                <i class="fa-solid fa-calendar-plus"></i> Programar cita</button>`
                            : `<a class="btn btn-outline-primary mt-auto" href="citas.html?nueva=1&medico=${m.id_medico}">
                                <i class="fa-solid ${Clinica.usuario.rol === 'Médico' ? 'fa-share-nodes' : 'fa-calendar-plus'}"></i>
                                ${Clinica.usuario.rol === 'Médico' ? 'Derivar paciente' : 'Programar cita'}</a>`}
                    </article>
                </div>`;
            }).join('');
        }
        filtro.addEventListener('change', dibujar);
        dibujar();

        // ----- Paciente: programa aquí mismo -----
        const $c = id => document.getElementById(id);
        const modalCita = bootstrap.Modal.getOrCreateInstance($c('modalCita'));
        const hoy = new Date().toLocaleDateString('en-CA');
        let medicoElegido = null;
        const mostrarErrorCita = (texto) => { const b = $c('errorCita'); b.textContent = texto; b.classList.remove('d-none'); };

        lista.addEventListener('click', (ev) => {
            const boton = ev.target.closest('[data-programar]');
            if (!boton) return;
            medicoElegido = med.medicos.find(m => String(m.id_medico) === boton.dataset.programar) || null;
            if (!medicoElegido) return;
            $c('cMedico').textContent = `Dr. ${medicoElegido.nombres} ${medicoElegido.apellidos}`;
            $c('cEspecialidad').innerHTML = medicoElegido.especialidades.map(x =>
                `<option value="${x.id_especialidad}">${Clinica.esc(x.nombre)}</option>`).join('');
            $c('cFecha').min = hoy;
            $c('cFecha').value = '';
            $c('cHora').innerHTML = '<option value="">Elija una fecha</option>';
            $c('cMotivo').value = '';
            $c('errorCita').classList.add('d-none');
            modalCita.show();
        });

        async function cargarHorasCita() {
            const fecha = $c('cFecha').value;
            if (!medicoElegido || !fecha) return;
            $c('cHora').innerHTML = '<option value="">Cargando horas…</option>';
            try {
                const d = await Clinica.api(`disponibilidad.php?medico=${medicoElegido.id_medico}&fecha=${fecha}`);
                $c('cHora').innerHTML = d.horas.length
                    ? '<option value="">Seleccione una hora…</option>' + d.horas.map(h => `<option value="${Clinica.esc(h.valor)}">${Clinica.esc(h.texto)}</option>`).join('')
                    : '<option value="">No hay horas libres ese día</option>';
            } catch (e) {
                $c('cHora').innerHTML = '<option value="">Elija otra fecha</option>';
                mostrarErrorCita(e.message);
            }
        }
        $c('cFecha').addEventListener('change', cargarHorasCita);
        $c('cEspecialidad').addEventListener('change', cargarHorasCita);

        $c('formCita').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            $c('errorCita').classList.add('d-none');
            const datos = {
                accion: 'crear',
                medico: medicoElegido ? medicoElegido.id_medico : '',
                especialidad: $c('cEspecialidad').value,
                fecha: $c('cFecha').value,
                hora: $c('cHora').value,
                motivo: $c('cMotivo').value.trim(),
            };
            if (!datos.medico || !datos.especialidad || !datos.fecha || !datos.hora) {
                mostrarErrorCita('Elija especialidad, fecha y hora.');
                return;
            }
            const boton = $c('btnCita');
            boton.disabled = true;
            try {
                await Clinica.api('citas.php', { metodo: 'POST', datos });
                modalCita.hide();
                Clinica.toast('Cita programada. La verá en Mis citas.');
            } catch (e) {
                mostrarErrorCita(e.message);
            } finally {
                boton.disabled = false;
            }
        });
    } catch (e) {
        lista.innerHTML = `<div class="col-12 text-danger">${Clinica.esc(e.message)}</div>`;
    }
});
</script>
</body>
</html>
