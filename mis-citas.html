<!DOCTYPE html>
<!--
    ARCHIVO: mis-citas.html | CAPA: FRONTEND (página del paciente)
    SIRVE PARA: que el paciente vea sus citas y reserve otra hablando o escribiendo.
    QUÉ HACE: pide backend/citas.php (el servidor solo devuelve sus propias citas) y dibuja la lista.
    CONECTA CON: backend/citas.php, js/app.js, js/voz.js, js/voz_ui.js, css/clinica.css
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vida Salud · Mis citas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/clinica.css">
</head>
<body>
<div class="app">
    <div id="menu"></div>
    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Mis citas</h1>
                <p>Aquí verá sus próximas consultas. Puede reservar otra cita hablando o escribiendo.</p>
            </div>
        </div>

        <!-- Reserva por voz: el paciente dicta la orden y revisa antes de confirmar -->
                <section class="tarjeta mb-3" id="panelVoz">
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <button type="button" id="btnMicro" class="btn-micro" aria-label="Reservar cita hablando">
                            <i class="fa-solid fa-microphone"></i> Hablar</button>
                        <div class="flex-grow-1">
                            <h2 class="mb-1"><i class="fa-solid fa-wand-magic-sparkles text-info"></i> Reserva por voz</h2>
                            <div class="small text-muted">Diga, por ejemplo: <em>«Quiero cita con el doctor Pérez, el lunes a las 8»</em>. Revise lo que entendí antes de confirmar.</div>
                            <span id="estadoVoz" class="small"></span>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2 flex-wrap">
                        <input type="text" id="textoVoz" class="form-control flex-grow-1" placeholder="…o escriba la orden aquí" aria-label="Orden de reserva">
                        <button type="button" class="btn btn-outline-primary" id="btnInterpretar">Entender</button>
                    </div>
            <div id="vSugerencia" class="alert alert-warning mt-3 d-none"></div>
        
                    <form id="formVoz" class="mt-3 d-none" novalidate>
                        <div class="small text-muted mb-2" id="vResumen"></div>
                        <div id="vAviso" class="alert d-none mt-2" role="alert"></div>
                <div id="vOpciones" class="alert alert-light border mt-2 d-none"></div>
                        <div class="row g-2">
                            <div class="col-md-3"><label class="form-label small">CI del paciente *</label>
                                <input class="form-control" id="vCi" maxlength="15" inputmode="numeric"></div>
                            <div class="col-md-3"><label class="form-label small">Médico *</label>
                                <select class="form-select" id="vMedico"></select></div>
                            <div class="col-md-3"><label class="form-label small">Especialidad *</label>
                                <select class="form-select" id="vEspecialidad"></select></div>
                            <div class="col-md-3"><label class="form-label small">Día *</label>
                                <input type="date" class="form-control" id="vFecha"></div>
                            <div class="col-md-3"><label class="form-label small">Hora libre *</label>
                                <select class="form-select" id="vHora"></select></div>
                            <div class="col-md-9"><label class="form-label small">Motivo (opcional)</label>
                                <input class="form-control" id="vMotivo" maxlength="200"></div>
                        </div>
                        <button type="submit" class="btn btn-lg text-white w-100 mt-3" id="vConfirmar" style="background:#0b7285;">
                            <i class="fa-solid fa-circle-check"></i> Confirmar reserva</button>
                    </form>
                </section>

        <section class="tarjeta">
            <h2 class="mb-3"><i class="fa-solid fa-calendar-days text-info"></i> Mis citas</h2>
            <div id="listaCitas" class="small text-muted">Cargando…</div>
        </section>
        <p class="small text-muted mt-4" data-info></p>
    </main>
</div>

<script src="js/app.js"></script>
<script src="js/voz.js"></script>
<script src="js/voz_ui.js"></script>
<script>
(function () {
    const $ = id => document.getElementById(id);

    /** Solo se puede cancelar una cita futura, con al menos 2 horas de anticipación. */
    function puedeCancelar(c) {
        if (!['Programada', 'Confirmada'].includes(c.estado)) return false;
        return new Date(c.inicio.replace(' ', 'T')) - new Date() > 2 * 60 * 60 * 1000;
    }

    $('listaCitas').addEventListener('click', async (ev) => {
        const b = ev.target.closest('button[data-cancelar]');
        if (!b) return;
        if (!confirm('¿Seguro que quiere cancelar esta cita?')) return;
        b.disabled = true;
        try {
            await Clinica.api('citas.php', { metodo: 'POST', datos: { accion: 'estado', id: b.dataset.cancelar, estado: 'Cancelada', motivo: 'Cancelada por el paciente' } });
            Clinica.toast('Su cita fue cancelada.');
            cargarCitas();
        } catch (e) {
            Clinica.toast(e.message, 'error');
            b.disabled = false;
        }
    });

    async function cargarCitas() {
        try {
            const d = await Clinica.api('citas.php');
            const hoy = new Date().toISOString().slice(0, 10);
            const citas = d.citas.slice().sort((a, b) => a.inicio.localeCompare(b.inicio));
            if (!citas.length) {
                $('listaCitas').textContent = 'Todavía no tiene citas. Puede reservar una con el micrófono o escribiendo la orden.';
                return;
            }
            $('listaCitas').innerHTML = citas.map(c => {
                const pasada = c.inicio.slice(0, 10) < hoy;
                return `<div class="border-bottom py-3 ${pasada ? 'opacity-75' : ''}">
                    <div class="d-flex flex-wrap justify-content-between gap-2">
                        <strong>${Clinica.fecha(c.inicio)}</strong>
                        ${Clinica.estadoBadge(c.estado)}
                    </div>
                    <div class="small">Dr. ${Clinica.esc(c.nombres_medico)} ${Clinica.esc(c.apellidos_medico)}
                        · ${Clinica.esc(c.especialidad)}</div>
                    ${c.motivo ? `<div class="small text-muted">Motivo: ${Clinica.esc(c.motivo)}</div>` : ''}
                    <div class="small text-muted">Código: ${Clinica.esc(c.codigo)}</div>
                    ${!pasada && ['Programada', 'Confirmada'].includes(c.estado) ? `<div class="small mt-1"><i class="fa-solid fa-circle-info text-info"></i> ${Clinica.esc(Clinica.preparacion(c.especialidad))}</div>` : ''}
                    ${puedeCancelar(c) ? `<button type="button" class="btn btn-sm btn-outline-danger mt-2" data-cancelar="${c.id_cita}"><i class="fa-solid fa-ban"></i> Cancelar cita</button>` : ''}
                </div>`;
            }).join('');
        } catch (e) {
            $('listaCitas').textContent = e.message;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const usuario = await Clinica.requerirSesion();
        if (usuario.rol !== 'Paciente') { location.replace('inicio.html'); return; }
        Clinica.dibujarMenu('mis-citas');
        cargarCitas();
        document.addEventListener('cita-reservada', cargarCitas);
    });
})();
</script>
</body>
</html>
